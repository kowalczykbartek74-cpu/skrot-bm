<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Przenoszę Twoje dane…</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F8F6;color:#14261C;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:16px}b{color:#1A7F45}</style>
</head><body><p><b>Skrót BM to teraz Zdawalni</b><br>Przenoszę Twoje ustawienia i postępy…</p>
<script>
/* Odbiór danych ze starej domeny skrotbm.pl (strona przekierowania z docs/zdawalni/przekierowanie/).
   Dane przychodzą w części adresu po # (nie trafia na serwer), od razu ją czyścimy.
   Format: #z.<base64url deflate-raw JSON> albo #j.<base64url JSON>; JSON = {v:1, d:{klucz:wartość}, p, q, h}.
   Zasady: import tylko raz na przeglądarkę (skrot-przeniesione). Jeśli w nowej domenie nie ma jeszcze logowania,
   stare dane wygrywają (to samo urządzenie, ta sama sesja, bez nowego urządzenia na liście). Jeśli już jest,
   dopisujemy tylko brakujące klucze. Wpuszczamy wyłącznie klucze Skrótu.
   k:"bm" (wejście ze skrotbm.pl): kto nie wybrał jeszcze kierunku, dostaje od razu Business Management. */
(async function () {
  var raw = location.hash.slice(1), dest = "/";
  try { history.replaceState(null, "", "/przenies.html"); } catch (e) {}
  var OK = /^(bm-|skrot-|sb-zkyxujkdrovfzpasocmv-)/, FLAG = "skrot-przeniesione";
  function b64(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  try {
    var kind = raw.slice(0, 2), bytes = b64(raw.slice(2)), text;
    if (kind === "z.") text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
    else if (kind === "j.") text = new TextDecoder().decode(bytes);
    else throw 0;
    var o = JSON.parse(text);
    if (o && o.v === 1 && o.d && typeof o.d === "object") {
      if (typeof o.q === "string" && o.q.charAt(0) === "?") dest += o.q;
      if (typeof o.h === "string" && o.h.charAt(0) === "#") dest += o.h;
      if (!localStorage.getItem(FLAG)) {
        var loggedHere = localStorage.getItem("sb-zkyxujkdrovfzpasocmv-auth-token") != null, n = 0;
        for (var k in o.d) {
          if (!OK.test(k) || typeof o.d[k] !== "string" || k === FLAG) continue;
          if (loggedHere && localStorage.getItem(k) != null) continue;
          try { localStorage.setItem(k, o.d[k]); n++; } catch (e) {}
        }
        localStorage.setItem(FLAG, new Date().toISOString() + " · " + n);
      }
      if (o.k === "bm" && !localStorage.getItem("skrot-rocznik") && !localStorage.getItem("skrot-kierunek")) localStorage.setItem("skrot-kierunek", "bm");
    }
  } catch (e) {}
  location.replace(dest);
})();
</script>
<noscript><p><a href="/">Przejdź do zdawalni.pl</a></p></noscript>
</body></html>
