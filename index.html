    } catch {}
    if (!paths.length) paths = Object.keys(zip.files).filter((p) => /^ppt\/slides\/slide\d+\.xml$/.test(p)).sort((a, b) => +a.match(/(\d+)\.xml/)[1] - +b.match(/(\d+)\.xml/)[1]);
    const slides = [];
    for (let i = 0; i < paths.length; i++) {
      const f = zip.file(paths[i]);
      let text = f ? xmlText(await f.async("string"), "a:p", "a:t") : "";
      try {
        const rf = zip.file(paths[i].replace(/slides\/(slide\d+\.xml)$/, "slides/_rels/$1.rels"));
        if (rf) {
          const rels = new DOMParser().parseFromString(await rf.async("string"), "application/xml");
          const nr = [...rels.getElementsByTagName("Relationship")].find((r) => /notesSlide/.test(r.getAttribute("Type") || ""));
          if (nr) {
            const nf = zip.file("ppt/" + nr.getAttribute("Target").replace(/^\.\.\//, ""));
            const notes = nf ? xmlText(await nf.async("string"), "a:p", "a:t").split("\n").filter((l) => !/^\d+$/.test(l)).join("\n") : "";
            if (notes) text += (text ? "\n" : "") + "[Notatki prowadzącego] " + notes;
          }
        }
      } catch {}
      slides.push({ n: i + 1, text });
    }
    return slides;
  }
  async function parsePdf(buf) {
    await loadScript(PDFWORKER);
    await loadScript(PDFJS);
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
    const slides = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const tc = await (await pdf.getPage(i)).getTextContent();
      let text = "";
      for (const it of tc.items) { text += it.str; if (it.hasEOL) text += "\n"; else if (it.str && !it.str.endsWith(" ")) text += " "; }
      slides.push({ n: i, text: text.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim() });
    }
    return slides;
  }
  async function parseDocx(buf) {
    await loadScript(JSZIP);
    const zip = await window.JSZip.loadAsync(buf);
    return chunkText(xmlText(await zip.file("word/document.xml").async("string"), "w:p", "w:t"));
  }
  // Długi tekst bez slajdów (DOCX, TXT) dzielimy na „strony” po ok. 2500 znaków.
  function chunkText(text) {
    const out = []; let cur = "";
    for (const line of text.split("\n")) { if ((cur + line).length > 2500 && cur) { out.push(cur.trim()); cur = ""; } cur += line + "\n"; }
    if (cur.trim()) out.push(cur.trim());
    return out.map((t, i) => ({ n: i + 1, text: t }));
  }
  const bytes = (s) => new TextEncoder().encode(s).length;
  function slidesForPrompt(slides, budget) {
    const fmt = (arr) => arr.map((s) => `--- Slide ${s.n} ---\n${s.text || "(no text on this slide)"}`).join("\n\n");
    let txt = fmt(slides);
    if (bytes(txt) <= budget) return txt;
    let cap = 4000;
    while (cap > 150) { txt = fmt(slides.map((s) => ({ n: s.n, text: s.text.length > cap ? s.text.slice(0, cap) + " […]" : s.text }))); if (bytes(txt) <= budget) return txt; cap = Math.floor(cap * 0.75); }
    return txt.slice(0, Math.floor(budget / 2));
  }
  function setStep(i, state, detail) { const U = S.upload; if (!U?.steps) return; U.steps[i].state = state; if (detail != null) U.steps[i].detail = detail; if (S.route.view === "upload" || S.route.view === "myUpload") render(); }

  // ================= nowy system (v2): slajdy są tylko mapą tematów =================
  // 1) AI czyta slajdy i robi WYŁĄCZNIE listę tematów z numerami slajdów (bez streszczania).
  // 2) Opracowanie pisze AI, które NIE dostaje tekstu slajdów: tylko nazwy tematów i pojęć.
  // 3) Fiszki i quiz powstają z naszego opracowania, nie ze slajdów.
  // 4) Kontrola: porównanie gotowego tekstu z tekstem slajdów (wspólne ciągi 7 słów).
  // Tekst slajdów nie jest nigdzie zapisywany; przy każdym temacie zostaje tylko odsyłacz „slajdy 12–15”.
  const sText = (v, n = 600) => (typeof v === "string" ? v.trim().slice(0, n) : "");
  const wordsOf = (s) => String(s || "").toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
  const OVERLAP_K = 7;
  function overlapCheck(slides, content) {
    const src = new Set();
    for (const s of slides) { const w = wordsOf(s.text); for (let i = 0; i + OVERLAP_K <= w.length; i++) src.add(w.slice(i, i + OVERLAP_K).join(" ")); }
    const texts = [content.tldr, content.purpose,
      ...(content.topics || []).flatMap((t) => [t.summary, t.why, t.example, ...(t.remember || [])]),
      ...(content.concepts || []).map((x) => x.definition),
      ...(content.flashcards || []).flatMap((f) => [f.q, f.a]),
      ...(content.quiz || []).flatMap((q) => [q.q, q.explanation, ...(q.options || [])])];
    let total = 0, hit = 0; const frags = [];
    for (const t of texts) {
      const w = wordsOf(t); if (w.length < OVERLAP_K) continue;
      let run = null;
      for (let i = 0; i + OVERLAP_K <= w.length; i++) {
        total++;
        if (!src.has(w.slice(i, i + OVERLAP_K).join(" "))) continue;
        hit++;
        if (run && i <= run.e) run.e = i + OVERLAP_K;
        else { if (run) frags.push(w.slice(run.s, run.e).join(" ")); run = { s: i, e: i + OVERLAP_K }; }
      }
      if (run) frags.push(w.slice(run.s, run.e).join(" "));
    }
    const fragments = [...new Set(frags)].sort((a, b) => b.length - a.length).slice(0, 8);
    const ratio = total ? hit / total : 0;
    return { ratio, pct: Math.round(ratio * 1000) / 10, fragments, flag: ratio > 0.05 || fragments.some((f) => f.split(" ").length >= 14) };
  }
  const langLineFor = (lang) => lang === "pl"
    ? "Write all study content in Polish. Keep the established English term in brackets at its first use, because the exam is in English."
    : "Write all study content in English, the language of the course. For each concept also give the Polish equivalent of the term in \"pl\".";

  // Wspólny rdzeń: nowe pliki i przerabianie starych materiałów. step(i, state, detail) raportuje postęp (i = 1..4).
  async function makeStudy({ subject, slides, fileName, lang, step = () => {}, ai = S.sample, ticket = null }) {
    const N = slides.length;
    let max = 120000;
    try { const l = await ai.limits(); if (l?.maxPromptBytes) max = l.maxPromptBytes; } catch {}
    const call = (p) => ai.json(p, { modelTier: "default", ticket });
    const slideOk = (n) => { const x = Math.round(Number(n)); return x >= 1 && x <= N ? x : null; };
    const subj = `"${subject.en || subject.pl}" (${subject.pl})`;

    // 1) mapa tematów
    step(1, "run");
    const mapPrompt = `You are indexing a lecture file for first-year Business Management students (University of Szczecin). Subject: ${subj}. File: "${fileName}", ${N} slides/pages.
Your ONLY job is to produce a topic map. A separate author will later write original study notes on these topics from general academic knowledge, WITHOUT seeing the slides. So:
- List the topics a student must understand, as neutral textbook-style names (max 60 chars). Do not reuse the lecturer's own headings word for word when a standard textbook name exists.
- For each topic give "slides": [first, last] = the slide numbers (1-${N}) where the lecture covers it. Merge neighbouring slides on the same topic.
- For each topic give up to 6 "concepts": standard academic terms (max 4 words each) that the topic involves.
- Do NOT summarise, quote or paraphrase what the slides say. Do NOT include the lecturer's examples, case studies, company names, numbers, charts or tables. If a case study illustrates a concept, list the concept, not the case.
- Skip organisational slides (agenda, contact, grading, literature list, thank you).
Lecturer notes marked [Notatki prowadzącego] belong to their slide.
Reply with only one JSON object: {"title": "generic descriptive title of the lecture, max 70 chars", "topics": [{"t": "topic", "slides": [12, 15], "concepts": ["term"]}]}
Give 3-12 topics in a sensible learning order.

SLIDES:
${slidesForPrompt(slides, Math.floor(max * 0.75) - 3000)}`;
    let M;
    try { M = await call(mapPrompt); } catch (e) { step(1, "err"); throw e; }
    const topics = (Array.isArray(M?.topics) ? M.topics : []).map((t) => {
      const raw = Array.isArray(t?.slides) ? t.slides : [t?.slide, t?.slide];
      let a = slideOk(raw[0]), b = slideOk(raw[raw.length - 1]) || a;
      if (a && b && b < a) [a, b] = [b, a];
      return { t: sText(t?.t, 90), slides: a ? [a, b] : null, concepts: (Array.isArray(t?.concepts) ? t.concepts : []).map((c) => sText(c, 60)).filter(Boolean).slice(0, 6) };
    }).filter((t) => t.t && t.slides).slice(0, 14);
    if (topics.length < 2) { step(1, "err"); throw { code: "no_topics" }; }
    step(1, "ok", `${topics.length} ${plural(topics.length, "temat", "tematy", "tematów")}`);
    const title = sText(M.title, 90);
    const mapTxt = JSON.stringify(topics.map((t, i) => ({ i, topic: t.t, concepts: t.concepts })));

    let last = null;
    for (let attempt = 0; attempt < 2; attempt++) {
      // 2) opracowanie: AI widzi tylko listę tematów
      step(2, "run", attempt ? "druga próba, innymi słowami" : "bez tekstu slajdów");
      const writePrompt = `You write ORIGINAL study materials for first-year Business Management students at the University of Szczecin. Subject: ${subj}.
The lecture covered the topics below. You have NOT seen the lecture and must not try to reconstruct it. Explain each topic from standard academic knowledge, as mainstream introductory textbooks present it, with your own structure, your own wording and your own examples (everyday life, student life, well-known businesses in general). Do not invent statistics, quotes or book/page citations. Keep it accurate; if a concept has several common definitions, give the most standard one.${attempt ? " Use fresh wording; avoid stock textbook sentences." : ""}
${langLineFor(lang)}
TOPICS: ${mapTxt}
Reply with only one JSON object:
{"tldr": "4-6 sentences: what this whole lecture is about, in plain words", "purpose": "2-4 sentences: why it matters and what it is used for in business practice", "topics": [{"i": 0, "summary": "3-5 sentences explaining the topic", "why": "1-2 sentences: what it is for / when you use it", "remember": ["2-4 exam-relevant points, one sentence each"], "example": "your own concrete example, 2-4 sentences"}], "concepts": [{"term": "term", "definition": "your own textbook-style definition, 1-2 sentences", "pl": "Polish term", "i": 0}]}
Cover every topic, in the given order ("i" = topic index). Give up to 15 concepts.`;
      let W;
      try { W = await call(writePrompt); } catch (e) { step(2, "err"); throw e; }
      const wt = Array.isArray(W?.topics) ? W.topics : [];
      const outTopics = topics.map((t, i) => {
        const w = wt.find((x) => Number(x?.i) === i) || {};
        return { t: t.t, slides: t.slides, summary: sText(w.summary, 1500), why: sText(w.why, 600), remember: (Array.isArray(w.remember) ? w.remember : []).map((r) => sText(r, 400)).filter(Boolean).slice(0, 6), example: sText(w.example, 1000) };
      });
      const tldr = sText(W?.tldr, 1500);
      if (!tldr || outTopics.filter((t) => t.summary).length < Math.ceil(topics.length / 2)) { step(2, "err"); throw { code: "incomplete" }; }
      const topicRange = (i) => outTopics[Math.round(Number(i))]?.slides || null;
      const concepts = (Array.isArray(W.concepts) ? W.concepts : []).map((x) => { const r = topicRange(x?.i); return { term: sText(x?.term, 120), definition: sText(x?.definition), pl: sText(x?.pl, 120), slide: r?.[0] || null, slides: r }; }).filter((x) => x.term && x.definition);
      const notes = outTopics.flatMap((t) => t.remember.map((p) => ({ point: p, slide: t.slides[0], slides: t.slides })));
      step(2, "ok");

      // 3) fiszki i quiz: tylko z naszego opracowania
      step(3, "run");
      const written = JSON.stringify({ tldr, topics: outTopics.map((t, i) => ({ i, topic: t.t, summary: t.summary, remember: t.remember, example: t.example })), concepts: concepts.map((c) => ({ term: c.term, definition: c.definition })) }).slice(0, 60000);
      const cardsPrompt = `Based ONLY on the study material below, create flashcards and a quiz for first-year Business Management students. Questions must test understanding of concepts: definitions, distinguishing similar ideas, classifying a short new situation, applying a tool. Never ask what a lecturer or a slide said. ${langLineFor(lang).replace(" For each concept also give the Polish equivalent of the term in \"pl\".", "")}
Every item carries "i" = index of the topic it tests.
Reply with only one JSON object: {"flashcards": [{"q": "question", "a": "short answer", "i": 0}], "quiz": [{"q": "question", "options": ["A", "B", "C", "D"], "correct": 0, "explanation": "why the answer is right, plain words, 1-2 sentences", "i": 0}]}
Give 10-15 flashcards and 10 quiz questions spread across topics. Quiz questions have 4 options (or exactly 2 options "True"/"False" for up to 3 statement questions); exactly one option is correct; "correct" is its 0-based index; vary its position; distractors plausible but clearly wrong.
MATERIAL:
${written}`;
      let B;
      try { B = await call(cardsPrompt); } catch (e) { step(3, "err"); throw e; }
      const okTopic = (i) => Number.isInteger(Number(i)) && !!topicRange(i);
      const flashcards = (Array.isArray(B?.flashcards) ? B.flashcards : []).map((x) => { const r = topicRange(x?.i); return { q: sText(x?.q, 300), a: sText(x?.a, 400), slide: r?.[0] || null, slides: r }; }).filter((x) => x.q && x.a);
      let dropped = 0;
      const quiz = (Array.isArray(B?.quiz) ? B.quiz : []).map((x) => {
        const options = Array.isArray(x?.options) ? x.options.map((o) => sText(o, 200)).filter(Boolean) : [];
        const correct = Number(x?.correct);
        const ok = sText(x?.q) && options.length >= 2 && options.length <= 4 && Number.isInteger(correct) && correct >= 0 && correct < options.length && new Set(options).size === options.length && okTopic(x?.i);
        if (!ok) { dropped++; return null; }
        const r = topicRange(x.i);
        return { q: sText(x.q, 400), options, correct, explanation: sText(x?.explanation), slide: r[0], slides: r };
      }).filter(Boolean);
      if (!quiz.length) { step(3, "err"); throw { code: "incomplete" }; }
      step(3, "ok", dropped ? `odrzucono ${dropped} ${plural(dropped, "wadliwe pytanie", "wadliwe pytania", "wadliwych pytań")}` : `${flashcards.length} fiszek, ${quiz.length} ${plural(quiz.length, "pytanie", "pytania", "pytań")}`);

      // 4) kontrola podobieństwa do slajdów
      step(4, "run");
      const content = { v: 2, lang, tldr, purpose: sText(W.purpose, 1000), topics: outTopics, notes, concepts, flashcards, quiz };
      const check = overlapCheck(slides, content);
      last = { title, content, check };
      if (!check.flag) { step(4, "ok", `wspólne ze slajdami: ${check.pct}%`); return last; }
    }
    step(4, "err", `za dużo wspólnych fragmentów ze slajdami (${last.check.pct}%)`);
    return { ...last, flagged: true };
  }

  async function saveNewStudy(r) {
    const U = S.upload;
    const ref = S.db.collection("materials").doc();
    const id = ref.id, c = r.content;
    await S.db.doc("materialContent/" + id).set(c);
    await ref.set({ v: 2, subjectId: U.subjectId, title: r.title || U.file.name.replace(/\.[^.]+$/, ""), fileName: U.file.name, fileType: U.parsed.ext, slideCount: U.parsed.slides.length, hash: U.parsed.hash, createdAt: Date.now(), createdBy: S.uid || null, topicCount: c.topics.length, noteCount: c.notes.length, conceptCount: c.concepts.length, flashcardCount: c.flashcards.length, quizCount: c.quiz.length, lang: U.lang, overlap: r.check.pct });
    S.content[id] = c;
    return { id, title: r.title || U.file.name, fileName: U.file.name };
  }

  async function runPipeline() {
    const U = S.upload;
    if (!U?.parsed || U.busy) return;
    if (U.mine) return runMine();
    const subject = subjectById(U.subjectId);
    if (!subject) { U.error = "Wybierz przedmiot."; render(); return; }
    U.busy = true; U.error = null; U.flagged = null;
    U.steps = [
      { label: "Odczytano tekst z pliku", state: "ok", detail: `${U.parsed.slides.length} ${plural(U.parsed.slides.length, "slajd", "slajdy", "slajdów")}` },
      { label: "Mapa tematów ze slajdów" },
      { label: "Opracowanie: o co chodzi, po co to jest, co zapamiętać" },
      { label: "Fiszki i quiz z opracowania" },
      { label: "Kontrola: nic nie jest przepisane ze slajdów" },
      { label: "Zapisuję dla całego roku" },
      { label: "Prostsza wersja i „Dlaczego?” do quizu" },
    ];
    render();
    let r;
    try { r = await makeStudy({ subject, slides: U.parsed.slides, fileName: U.file.name, lang: U.lang, step: setStep }); }
    catch (e) { U.busy = false; U.error = sampleError(e); render(); return; }
    if (r.flagged) { U.busy = false; U.flagged = r; render(); return; }

  }

  async function finishUpload(r) {
    const U = S.upload;
    if (U?.mine) return finishMine(r);
    U.busy = true; U.flagged = null;
    setStep(5, "run");
    let mat;
    try { mat = await saveNewStudy(r); setStep(5, "ok"); glossaryRebuild(U.subjectId).catch(() => {}); }
    catch (err) {
      setStep(5, "err"); U.busy = false;
      U.error = err?.code === "not_granted" ? "Zapis materiałów jest dostępny tylko dla starosty." : "Nie udało się zapisać materiałów. Spróbuj ponownie.";
      render(); return;
    }
    setStep(6, "run");
    const [rs, rw] = await Promise.allSettled([buildSimple(mat, r.content), buildWhy(mat, r.content)]);
    const fails = [rs, rw].filter((x) => x.status === "rejected").length;
    setStep(6, fails ? "err" : "ok", fails ? "nie wszystko się udało, uzupełnisz to w Panelu AI" : null);
    if (AI.status) { if (rs.status === "fulfilled") AI.status.simple.add(mat.id); if (rw.status === "fulfilled" && rw.value) AI.status.why.add(mat.id); }
    S.upload = null;
    toast(fails ? "Materiał zapisany. Prostą wersję uzupełnij w Panelu AI." : "Gotowe. Materiały widzi cały rok.");
    go({ view: "material", id: mat.id, tab: "skrot" });
  }
  function sampleError(e) {
    switch (e?.code) {
      case "not_granted": return "AI jest dostępne tylko dla starosty.";
      case "rate_limited": case "queue_overflow": return "Za dużo zapytań naraz. Odczekaj minutę i spróbuj ponownie.";
      case "prompt_too_large": return "Plik jest za długi na jedno przetworzenie. Podziel prezentację na mniejsze części.";
      case "invalid_json": case "empty_completion": return "Odpowiedź AI była niekompletna. Spróbuj jeszcze raz.";
      case "refused": return "AI odmówiło przetworzenia tego pliku.";
      case "not_deployed": case "no_function": return "Funkcja AI na serwerze nie odpowiada. Wdróż ją (README → „Funkcja AI”) albo użyj paczki do wygenerowania w Panelu AI.";
      case "no_key": return "Brakuje klucza API Anthropic w ustawieniach Supabase.";
      case "no_topics": return "AI nie znalazło w pliku tematów do opracowania. Sprawdź, czy to na pewno wykład (a nie np. sama lista literatury).";
      case "incomplete": return "AI zwróciło niepełne opracowanie. Spróbuj jeszcze raz.";
      case "no_source": return "Nie ma zapisanego tekstu slajdów. Wgraj ten plik jeszcze raz przez „Wgraj prezentację”, a stary materiał usuń.";
      default: return "Przetwarzanie nie powiodło się. Spróbuj ponownie za chwilę.";
    }
  }

  // ================= Moje materiały: własne pliki, opracowane tak samo jak materiały roku =================
  // Każda osoba z pełnym dostępem wgrywa swój plik, a ten sam proces (mapa tematów → opracowanie → fiszki i quiz →
  // kontrola → prosty język i „Dlaczego?”) zapisuje wynik w wybranej przez nią sekcji. Materiały są prywatne
  // (kolekcje myMaterials i myContent, reguły w supabase/skrot-v4-moje.sql). Sekcje to lista w postępie nauki tej osoby.
  // AI działa na bilecie: jeden bilet = jeden plik, limit plików pilnuje baza.
  const DEF_FOLDER = { id: "materialy", name: "Materiały" };
  const myFolders = () => { const f = Array.isArray(S.progress?.myFolders) ? S.progress.myFolders.filter((x) => x?.id && x?.name) : []; return f.length ? f : [DEF_FOLDER]; };
  const folderById = (id) => myFolders().find((f) => f.id === id);
  const folderOf = (m) => folderById(m?.sectionId) || myFolders()[0];
  const mineIn = (fid) => S.mine.filter((m) => folderOf(m).id === fid);
  const GENERIC_SUBJECT = { pl: "studia Business Management, 1. rok", en: "Business Management (first year)" };
  const cleanName = (v) => String(v || "").replace(/\s+/g, " ").trim().slice(0, 40);
  const partsTxt = (m, n = m?.slideCount || 0) => m?.fileType === "pptx" ? `${n} ${plural(n, "slajd", "slajdy", "slajdów")}` : m?.fileType === "pdf" ? `${n} ${plural(n, "strona", "strony", "stron")}` : `${n} ${plural(n, "część", "części", "części")}`;
  async function saveFolders(list) { await saveProgress({ myFolders: list }); render(); }
  function folderForm(title, value, onSave) {
    modal((close) => {
      const inp = h("input", { class: "input", id: "fold-name", maxlength: "40", value: value || "", autocomplete: "off", placeholder: "np. Notatki z ćwiczeń, Makro przed kolokwium" });
      const save = async () => { const n = cleanName(inp.value); if (!n) { inp.focus(); return; } close(); await onSave(n); };
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); save(); } });
      return [h("h3", { text: title }), h("label", { class: "field", for: "fold-name" }, "Nazwa sekcji", inp),
        h("div", { class: "row" }, h("button", { type: "button", class: "btn primary", onclick: save }, "Zapisz"), h("button", { type: "button", class: "btn ghost", onclick: close }, "Anuluj"))];
    });
  }
  function newFolder(then) {
    folderForm("Nowa sekcja", "", async (name) => {
      const list = myFolders();
      const same = list.find((f) => f.name.toLowerCase() === name.toLowerCase());
      if (same) { toast("Masz już sekcję o tej nazwie."); then?.(same); return; }
      const f = { id: "s" + Date.now().toString(36), name };
      await saveFolders([...list, f]);
      toast(`Dodano sekcję „${name}”.`);
      then?.(f);
    });

  async function runMine() {
    const U = S.upload;
    if (!S.ai) { U.error = "Nie mogę połączyć się z AI. Odśwież stronę."; render(); return; }
    U.busy = true; U.error = null; U.flagged = null; U.steps = null; render();
    try { const t = await window.skrot.mojeStart(); U.ticket = t?.bilet || null; S.myQuota = { ...(S.myQuota || {}), ...t }; }
    catch (e) { U.busy = false; U.error = mineError(e); render(); return; }
    const sec = folderOf({ sectionId: U.sectionId });
    U.steps = [
      { label: "Odczytano tekst z pliku", state: "ok", detail: partsTxt({ fileType: U.parsed.ext }, U.parsed.slides.length) },
      { label: "Mapa tematów z pliku" },
      { label: "Opracowanie: o co chodzi, po co to jest, co zapamiętać" },
      { label: "Fiszki i quiz z opracowania" },
      { label: "Kontrola: nic nie jest przepisane z pliku" },
      { label: `Zapisuję w sekcji „${sec.name}”` },
      { label: "Prostsza wersja i „Dlaczego?” do quizu" },
    ];
    render();
    let r;
    try { r = await makeStudy({ subject: subjectById(U.subjectId) || GENERIC_SUBJECT, slides: U.parsed.slides, fileName: U.file.name, lang: U.lang, step: setStep, ai: S.ai, ticket: U.ticket }); }
    catch (e) { U.busy = false; U.error = mineError(e); render(); return; }
    if (r.flagged) { U.busy = false; U.flagged = r; render(); return; }
    await finishMine(r);
  }

  // Chwilowy błąd AI nie powinien zostawić materiału bez prostego języka: jedna ponowna próba.
  const twice = async (fn) => { try { return await fn(); } catch { await new Promise((res) => setTimeout(res, 1500)); return fn(); } };
  // Uzupełnienie brakującego prostego języka / „Dlaczego?” we własnym materiale (nowy bilet = jeden plik z limitu).
  const FILL = { busy: null };
  async function fillMine(m) {
    if (FILL.busy) return;
    const c = await getContent(m.id).catch(() => null);
    if (!c || !S.ai) return;
    FILL.busy = m.id; render();
    let ticket = null;
    try { ticket = (await window.skrot.mojeStart())?.bilet || null; }
    catch (e) { FILL.busy = null; render(); toast(mineError(e)); return; }
    let fails = 0;
    if (!c.simple) { try { await twice(() => buildSimple(m, c, S.ai, ticket)); } catch { fails++; } }
    if (!c.why && c.quiz?.length) { try { await twice(() => buildWhy(m, c, S.ai, ticket)); } catch { fails++; } }
    delete S.simple[m.id]; delete S.why[m.id];
    S.myQuota = undefined; FILL.busy = null; render();
    toast(fails ? "Nie wszystko się udało. Spróbuj za chwilę." : "Gotowe: prosty język i wyjaśnienia do quizu są uzupełnione.");
  }
  function fillNote(m, c) {
    if (!isMine(m) || !c || (c.simple && (c.why || !c.quiz?.length))) return null;
    const what = [!c.simple ? "prostego języka" : null, !c.why && c.quiz?.length ? "wyjaśnień „Dlaczego?” do quizu" : null].filter(Boolean).join(" i ");

      h("span", { text: `Przy wgrywaniu nie udało się przygotować ${what}.` }),
      h("button", { type: "button", class: "btn small primary", disabled: FILL.busy ? true : null, onclick: () => fillMine(m) }, FILL.busy === m.id ? "Uzupełniam…" : "Uzupełnij teraz"),
      h("span", { class: "muted", style: "font-size:.84rem", text: "liczy się jako 1 plik z limitu" }));
  }

  async function finishMine(r) {
    const U = S.upload;
    U.busy = true; U.flagged = null; render();
    setStep(5, "run");
    let mat;
    try {
      const id = S.db.collection("myMaterials").doc().id, c = r.content;
      await S.db.doc("myContent/" + id).set(c);
      const meta = { v: 2, sectionId: U.sectionId, subjectId: U.subjectId || null, title: r.title || U.file.name.replace(/\.[^.]+$/, ""), fileName: U.file.name, fileType: U.parsed.ext, slideCount: U.parsed.slides.length, hash: U.parsed.hash, createdAt: Date.now(), createdBy: S.uid || null, topicCount: c.topics.length, noteCount: c.notes.length, conceptCount: c.concepts.length, flashcardCount: c.flashcards.length, quizCount: c.quiz.length, lang: U.lang, overlap: r.check.pct };
      await S.db.doc("myMaterials/" + id).set(meta);

      setStep(5, "err"); U.busy = false;
      U.error = /godzin/i.test(err?.message || "") ? "Za dużo nowych materiałów w ciągu godziny. Spróbuj później." : "Nie udało się zapisać materiału. Spróbuj ponownie.";

    }
    // Po kolei, bo obie wersje dopisują się do tej samej treści materiału.

    try { await twice(() => buildWhy(mat, r.content, S.ai, U.ticket)); } catch { fails++; }
    setStep(6, fails ? "err" : "ok", fails ? "nie wszystko się udało, reszta materiału jest gotowa" : null);
    S.upload = null;
    toast(fails ? "Materiał zapisany. Brakujące wyjaśnienia uzupełnisz przyciskiem przy materiale." : `Gotowe. Materiał jest w sekcji „${folderOf(mat).name}”.`);

  }

  // ================= prosty język i „Dlaczego?” =================
  // Obie wersje powstają z góry (przy wgrywaniu materiału albo w Panelu AI starosty) i są zapisane w bazie.
  // Studenci tylko je czytają: nie ma przycisków, które wołają AI.
  S.simple = {}; S.why = {};
  async function getSimple(id) {
    if (S.simple[id] !== undefined) return S.simple[id];
    if (isMine(materialById(id))) { const c = await getContent(id); return (S.simple[id] = c?.simple || null); }
    const snap = await S.db.doc("materialSimple/" + id).get();
    return (S.simple[id] = snap.exists ? snap.data() : null);
  }
  async function getWhy(mid) {
    if (S.why[mid] !== undefined) return S.why[mid];
    if (isMine(materialById(mid))) { const c = await getContent(mid).catch(() => null); return (S.why[mid] = c?.why || null); }
    let d = null;
    try { const snap = await S.db.doc("quizWhy/" + mid).get(); d = snap.exists ? snap.data() : null; } catch {}
    return (S.why[mid] = d);

  function simpleSourceObj(m, c) {
    const L = c.lesson;
    return { title: m.title || m.fileName, tldr: c.tldr, notes: (c.notes || []).map((n) => n.point), concepts: (c.concepts || []).map((x) => ({ term: x.term, def: x.def || x.definition || x.text })), lesson: L ? { intro: L.intro, sections: (L.sections || []).map((s) => ({ h: s.h, body: s.body, example: s.example })) } : undefined };
  }
  const simpleSource = (m, c) => JSON.stringify(simpleSourceObj(m, c)).slice(0, 60000);
  const SIMPLE_RULES = `Jesteś nauczycielem, który tłumaczy trudne rzeczy ze studiów (Business Management) tak, żeby zrozumiał je 12–13-latek. Na podstawie materiału napisz wersję w prostym języku: po polsku, krótkie zdania, każde trudne pojęcie wyjaśnione na przykładzie z codziennego życia nastolatka (sklepik szkolny, kieszonkowe, gra, boisko, pizza, telefon, wycieczka klasowa, lemoniada). Angielski termin podaj w nawiasie przy pierwszym użyciu, bo egzamin jest po angielsku. Nie upraszczaj do nieprawdy i nie dodawaj faktów spoza materiału. W polach intro, text i remember nie używaj żadnych wzorów ani symboli, tylko słów i obrazów z życia; zdania do ok. 15 słów. Wzory (LaTeX w \\( ... \\)) wolno tylko w example, najwyżej 1-2, po historyjce i z policzonymi liczbami. Pisz w drugiej osobie.
Format JSON: {"intro": "2-3 zdania, o czym to i po co", "parts": [{"h": "tytuł (ang. termin)", "emoji": "jedno emoji", "text": "2-4 zdania wyjaśnienia", "example": "przykład z życia, 2-4 zdania, z liczbami gdy pasuje", "remember": "jedno zdanie do zapamiętania"}], "words": [{"term": "pojęcie (english)", "simple": "max 1 zdanie"}], "check": [{"q": "pytanie sprawdzające", "a": "krótka odpowiedź z uzasadnieniem"}]}
parts: 4-7, words: 5-10, check: 2-3.`;
  const WHY_RULES = `Jesteś cierpliwym korepetytorem studentów 1. roku Business Management. Do każdego pytania z quizu napisz PROSTE wyjaśnienie po polsku, tak żeby zrozumiał je 13-latek: krótkie zdania (do ok. 15 słów), bez żargonu, najlepiej z małym przykładem z życia (sklepik, kieszonkowe, pizza, telefon). Angielski termin daj w nawiasie, bo egzamin jest po angielsku. Nie wymyślaj faktów spoza materiału i nie upraszczaj do nieprawdy.
Format JSON: {"items": [{"i": 0, "why": "2-3 krótkie zdania: czemu poprawna odpowiedź jest dobra", "example": "1-2 zdania, przykład z życia (może być pusty)", "not": ["dla KAŻDEJ opcji po kolei: jedno krótkie zdanie, czemu ta opcja jest zła; dla poprawnej opcji pusty tekst"]}]}
Tablica "not" ma tyle elementów, ile opcji ma pytanie. Zrób wpis dla każdego pytania.`;
  const whyQuestions = (c) => (c?.quiz || []).map((q, i) => ({ i, q: q.q, options: q.options, correct: q.correct, note: q.explanation || "" }));

  // Sprawdzenie i oczyszczenie gotowych wersji (z AI na serwerze albo z wgranej paczki).
  const txt = (v, n) => (typeof v === "string" ? v.trim().slice(0, n) : "");
  function cleanSimple(r) {
    const parts = (Array.isArray(r?.parts) ? r.parts : []).map((p) => ({ h: txt(p?.h, 160), emoji: txt(p?.emoji, 8), text: txt(p?.text, 1200), example: txt(p?.example, 1200), remember: txt(p?.remember, 400) })).filter((p) => p.h && p.text);
    if (!parts.length) return null;
    return {
      intro: txt(r.intro, 800), parts,
      words: (Array.isArray(r.words) ? r.words : []).map((w) => ({ term: txt(w?.term, 160), simple: txt(w?.simple, 400) })).filter((w) => w.term && w.simple),
      check: (Array.isArray(r.check) ? r.check : []).map((q) => ({ q: txt(q?.q, 400), a: txt(q?.a, 800) })).filter((q) => q.q && q.a),
      by: "auto", at: Date.now(),
    };
  }
  function cleanWhy(r, nQuestions) {
    const items = {};
    const list = Array.isArray(r?.items) ? r.items : r?.items && typeof r.items === "object" ? Object.entries(r.items).map(([i, x]) => ({ ...x, i })) : [];
    for (const x of list) {
      const i = Number(x?.i); if (!Number.isInteger(i) || i < 0 || (nQuestions != null && i >= nQuestions)) continue;
      const why = txt(x?.why, 600); if (!why) continue;
      items[i] = { why, example: txt(x?.example, 400), not: Array.isArray(x?.not) ? x.not.map((t) => txt(t, 300)) : [] };
    }
    return Object.keys(items).length ? { items, at: Date.now() } : null;
  }

  async function buildSimple(m, c, ai = S.sample, ticket = null) {
    const r = await ai.json(`${SIMPLE_RULES}\nOdpowiedz wyłącznie jednym obiektem JSON w tym formacie.\nMATERIAŁ:\n${simpleSource(m, c)}`, { modelTier: "default", ticket });
    const doc = cleanSimple(r);
    if (!doc) throw { code: "invalid_json" };
    if (isMine(m)) { await S.db.doc("myContent/" + m.id).update({ simple: doc }); if (S.content[m.id]) S.content[m.id].simple = doc; }
    else await S.db.doc("materialSimple/" + m.id).set(doc);
    S.simple[m.id] = doc;
    return doc;
  }
  async function buildWhy(m, c, ai = S.sample, ticket = null) {
    const qs = whyQuestions(c);
    if (!qs.length) return null;
    const notes = (c.notes || []).map((n) => n.point).join("\n").slice(0, 12000);
    const r = await ai.json(`${WHY_RULES}\nOdpowiedz wyłącznie jednym obiektem JSON w tym formacie.\nNOTATKI Z MATERIAŁU:\n${notes}\nPYTANIA:\n${JSON.stringify(qs)}`, { modelTier: "default", ticket });
    const doc = cleanWhy(r, qs.length);
    if (!doc) throw { code: "invalid_json" };
    if (isMine(m)) { await S.db.doc("myContent/" + m.id).update({ why: doc }); if (S.content[m.id]) S.content[m.id].why = doc; }
    else await S.db.doc("quizWhy/" + m.id).set(doc);
    S.why[m.id] = doc;
    return doc;
  }

      (d.parts || []).map((p) => h("section", { class: "spart" },
        h("h2", {}, h("span", { class: "emo", "aria-hidden": "true", text: p.emoji || "💡" }), h("span", { text: p.h })),
        h("p", { class: "txt" }, inline(p.text)),
        p.example ? h("div", { class: "ex" }, h("b", { class: "lbl", text: "Na przykładzie" }), h("span", {}, inline(p.example))) : null,
        p.remember ? h("div", { class: "rem" }, inline(p.remember)) : null)),
      d.words?.length ? h("section", { class: "stack", style: "gap:10px" }, h("h2", { text: "Słowniczek" }), h("div", { class: "swords" }, d.words.map((w) => h("div", {}, h("b", { text: w.term }), h("span", {}, inline(w.simple)))))) : null,
      d.check?.length ? h("section", { class: "stack scheck", style: "gap:8px" }, h("h2", { text: "Sprawdź, czy łapiesz" }),
        d.check.map((q) => h("details", {}, h("summary", {}, inline(q.q)), h("div", { class: "ans" }, inline(q.a))))) : null,
      h("p", { class: "foot-note", text: "Prostsza wersja pomaga zrozumieć temat. Do egzaminu przeczytaj też wersję Normalnie i zrób quiz, bo tam są dokładne definicje po angielsku." }));
  }

  function whyBlock(q, picked) {
    const ok = picked === q.correct, mid = q.materialId, letter = (i) => "ABCD"[i];
    const head = h("span", { class: "verdict " + (ok ? "ok" : "no"), text: ok ? "Dobrze!" : `Niestety nie. Poprawna jest ${letter(q.correct)}.` });
    let w = null, loading = false;
    if (mid != null) {
      const d = S.why[mid];

      loading ? h("p", { class: "wait", text: "Ładuję wyjaśnienie…" }) : null,
      q.explanation ? h("p", {}, inline(q.explanation)) : (loading ? null : h("p", { class: "wait", text: "Brak wyjaśnienia do tego pytania." })));
    const notTxt = !ok && w.not?.[picked];
    return h("div", { class: "why" }, head,
      h("div", {}, h("span", { class: "lbl", text: `Czemu ${letter(q.correct)}?` }), h("p", {}, inline(w.why))),
      w.example ? h("p", { class: "ex" }, inline(w.example)) : null,
      notTxt ? h("div", { class: "not" }, h("span", { class: "lbl", text: `Czemu nie ${letter(picked)}?` }), h("p", {}, inline(notTxt))) : null,

  // ================= Panel AI (tylko starosta) =================
  // Pokazuje, którym materiałom brakuje prostej wersji albo „Dlaczego?”, i uzupełnia je hurtem:
  // przez funkcję AI na serwerze albo przez paczkę JSON (pobierasz, generujesz np. w czacie z Claude, wgrywasz).
  const AI = { status: null, busy: false, stop: false, log: [], loading: false };
  async function aiRefresh() {
    if (!S.canEdit || AI.loading) return;
    AI.loading = true;
    try {
      const [simple, why] = await Promise.all([window.skrot.ids("materialSimple"), window.skrot.ids("quizWhy")]);
      AI.status = { simple: new Set(simple), why: new Set(why) };
      S.aiMissing = aiTodo().length;
    } catch { AI.status = null; }
    AI.loading = false;
    render();
  }
  const aiNeedsWhy = (m) => (m.quizCount ?? 1) > 0;
  function aiTodo() {
    if (!AI.status) return [];
    return S.materials.filter((m) => !AI.status.simple.has(m.id) || (aiNeedsWhy(m) && !AI.status.why.has(m.id)));
  }
  async function aiGenerateAll() {
    if (AI.busy) return;
    if (!S.sample) { toast("Funkcja AI jest dostępna tylko po zalogowaniu jako starosta."); return; }
    AI.busy = true; AI.stop = false; AI.log = [];
    const todo = aiTodo();
    for (const m of todo) {
      if (AI.stop) break;
      const line = { title: m.title || m.fileName, state: "run", detail: "" }; AI.log.push(line); render();
      try {
        const c = await getContent(m.id);
        if (!c) throw { code: "empty_completion" };
        if (!AI.status.simple.has(m.id)) { await buildSimple(m, c); AI.status.simple.add(m.id); }
        if (aiNeedsWhy(m) && !AI.status.why.has(m.id) && whyQuestions(c).length) { await buildWhy(m, c); AI.status.why.add(m.id); }
        line.state = "ok";
      } catch (e) {
        line.state = "err"; line.detail = sampleError(e);
        if (["not_deployed", "no_function", "no_key", "not_granted"].includes(e?.code)) { AI.stop = true; toast(line.detail); }
      }
      S.aiMissing = aiTodo().length; render();
    }
    AI.busy = false; render();
  }
  async function aiExport() {
    const todo = aiTodo();
    if (!todo.length) { toast("Wszystkie materiały mają już obie wersje."); return; }
    const items = [];
    for (const m of todo) {
      const c = await getContent(m.id).catch(() => null);
      if (!c) continue;
      const it = { id: m.id, title: m.title || m.fileName };
      if (!AI.status.simple.has(m.id)) it.simple = simpleSourceObj(m, c);
      if (aiNeedsWhy(m) && !AI.status.why.has(m.id) && whyQuestions(c).length) it.why = { notes: (c.notes || []).map((n) => n.point), questions: whyQuestions(c) };
      items.push(it);
    }
    const pack = {
      instrukcja: "Dla każdego elementu z listy „materialy”: jeśli ma pole „simple”, przygotuj prostą wersję według zasad „zasady_simple”; jeśli ma pole „why”, przygotuj wyjaśnienia do pytań według zasad „zasady_why”. Odpowiedz jednym plikiem JSON: {\"materialSimple\": {\"<id>\": {...format simple...}}, \"quizWhy\": {\"<id>\": {...format why...}}}. Użyj dokładnie tych samych id.",
      zasady_simple: SIMPLE_RULES, zasady_why: WHY_RULES, materialy: items,
    };
    const blob = new Blob([JSON.stringify(pack, null, 1)], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: `skrot-bm-do-wygenerowania-${todayKey()}.json` });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  async function aiImport(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch { toast("To nie jest poprawny plik JSON."); return; }
    const rows = [], bad = [];
    for (const [id, r] of Object.entries(data?.materialSimple || {})) {
      const m = materialById(id); const doc = m && cleanSimple(r);
      if (doc) rows.push({ collection: "materialSimple", id, data: doc }); else bad.push(id);
    }
    for (const [id, r] of Object.entries(data?.quizWhy || {})) {
      const m = materialById(id); const doc = m && cleanWhy(r, m.quizCount ?? null);
      if (doc) rows.push({ collection: "quizWhy", id, data: doc }); else bad.push(id);
    }
    if (!rows.length) { toast("W pliku nie ma niczego do wgrania (sprawdź format i id materiałów)."); return; }
    try {
      await window.skrot.putMany(rows);
      for (const r of rows) (r.collection === "materialSimple" ? S.simple : S.why)[r.id] = r.data;
      toast(`Wgrano ${rows.length} ${plural(rows.length, "wersję", "wersje", "wersji")}${bad.length ? `, pominięto ${bad.length} z błędami` : ""}.`);
    } catch { toast("Nie udało się zapisać w bazie."); }
    aiRefresh();
  }
  // Przerabianie starych materiałów (powstałych bezpośrednio ze slajdów) na nowy system.
  // Tekst slajdów z bazy służy tylko do mapy tematów i kontroli, a po udanym przerobieniu jest kasowany.
  const MIG = { busy: false, stop: false, log: [] };
  const oldSlideMaterials = () => S.materials.filter((m) => fromSlides(m) && !isV2(m)).sort((a, b) => Number(isFree(b)) - Number(isFree(a)) || (a.createdAt || 0) - (b.createdAt || 0));
  async function migrateOne(m, line) {
    const src = await getSource(m.id).catch(() => null);
    if (!src?.slides?.some((x) => x.text)) throw { code: "no_source" };
    const subject = subjectById(m.subjectId) || { pl: "", en: "" };
    const names = ["", "mapa tematów", "opracowanie", "fiszki i quiz", "kontrola"];
    const r = await makeStudy({ subject, slides: src.slides, fileName: m.fileName || m.title || "", lang: m.lang || "en", step: (i, st) => { if (st === "run") { line.detail = `${i}/4 ${names[i]}…`; render(); } } });
    if (r.flagged) throw { code: "flagged", pct: r.check.pct };
    const c = r.content;
    await S.db.doc("materialContent/" + m.id).set(c);
    await S.db.doc("materials/" + m.id).update({ v: 2, workedCount: null, workedTaskCount: null, title: r.title || m.title, topicCount: c.topics.length, noteCount: c.notes.length, conceptCount: c.concepts.length, flashcardCount: c.flashcards.length, quizCount: c.quiz.length, overlap: r.check.pct, migratedAt: Date.now() });
    m.v = 2; if (r.title) m.title = r.title;
    S.content[m.id] = c;
    glossaryRebuild(m.subjectId).catch(() => {});
    await Promise.all(["materialSources", "materialSimple", "quizWhy"].map((col) => S.db.doc(col + "/" + m.id).delete().catch(() => {})));
    delete S.sources[m.id]; delete S.simple[m.id]; delete S.why[m.id];
    if (AI.status) { AI.status.simple.delete(m.id); AI.status.why.delete(m.id); }
    line.detail = "prosty język i „Dlaczego?”…"; render();
    const mat = { id: m.id, title: m.title, fileName: m.fileName };
    const [rs, rw] = await Promise.allSettled([buildSimple(mat, c), buildWhy(mat, c)]);
    if (AI.status) { if (rs.status === "fulfilled") AI.status.simple.add(m.id); if (rw.status === "fulfilled" && rw.value) AI.status.why.add(m.id); }
    return `${c.topics.length} ${plural(c.topics.length, "temat", "tematy", "tematów")}, wspólne ze slajdami ${r.check.pct}%${rs.status === "rejected" || rw.status === "rejected" ? " · prostą wersję uzupełnij niżej" : ""}`;
  }
  async function migrateAll() {
    if (MIG.busy) return;
    if (!S.sample) { toast("Funkcja AI jest dostępna tylko po zalogowaniu jako starosta."); return; }
    MIG.busy = true; MIG.stop = false; MIG.log = [];
    for (const m of oldSlideMaterials()) {
      if (MIG.stop) break;
      const line = { title: m.title || m.fileName, state: "run", detail: "" }; MIG.log.push(line); render();
      try { line.detail = await migrateOne(m, line); line.state = "ok"; }
      catch (e) {
        line.state = "err";
        line.detail = e?.code === "flagged" ? `za dużo wspólnych fragmentów ze slajdami (${e.pct}%), stara wersja została; spróbuj jeszcze raz` : sampleError(e);
        if (["not_deployed", "no_function", "no_key", "not_granted"].includes(e?.code)) { MIG.stop = true; toast(line.detail); }
      }
      S.aiMissing = aiTodo().length; render();
    }
    MIG.busy = false; render();
  }
  function migrateSection() {
    const old = oldSlideMaterials();

  // ================= NAUKA+ (v3): powtórki, słowniczek, mapa postępów, zadania krok po kroku, tryb przed kolokwium, ściągawki =================
  // Wszystko działa w przeglądarce. Postęp każdej osoby jest w jej dokumencie progress:
  //   srs     { "<materialId>:<hash pytania>": [pudełko 0–6, dzień następnej powtórki] }, karty ze słowniczka: "g:<przedmiot>:<hash>"
  //   srsNew  { d: dzień, n: ile nowych kart weszło tego dnia }, streak { d, n }
  //   ex      { "<materialId>:<id przykładu>:<nr zadania>": [rozwiązane 0/1, z podpowiedzią 0/1] }

  // „Dzień” to numer dnia od 1 stycznia 2026 (czas lokalny), żeby zapis był krótki.
  const D0 = new Date(2026, 0, 1);
  const dayN = (k = todayKey()) => Math.round((dparse(k) - D0) / 864e5);
  const dayKeyOf = (n) => dkey(addDays(D0, n));
  const hashStr = (s) => { let x = 2166136261; for (const ch of String(s)) { x ^= ch.codePointAt(0); x = Math.imul(x, 16777619) >>> 0; } return x.toString(36); };
  const norm = (s) => String(s || "").toLowerCase().replace(/ł/g, "l").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
  const firstSentence = (s, n = 180) => { const t = String(s || "").trim(); const m = t.match(/^.+?[.!?](\s|$)/); const x = (m ? m[0] : t).trim(); return x.length > n ? x.slice(0, n - 1).trimEnd() + "…" : x; };
  const cap1 = (s) => String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1);

  const zalPartOf = (sid, part) => zalOf(sid)?.parts.find((p) => p.k === part) || null;

  function partLabel(sid, part) {

  // ================= powtórki rozłożone w czasie (pudełka Leitnera) =================
  const SRS_DAYS = [0, 1, 3, 7, 14, 30, 60];
  const NEW_PER_DAY = 20;
  const cardKey = (mid, card) => mid + ":" + hashStr(card.q);

  function srsGrade(key, g) { // g: 0 nie pamiętam, 1 trudne, 2 pamiętam, 3 łatwe
    const all = srsAll(), t = dayN();
    const cur = all[key];
    let box = cur?.[0] || 0;
    box = g === 0 ? 1 : g === 1 ? Math.max(1, box) : Math.min(6, box + (g === 3 ? 2 : 1));
    let due = g === 0 ? t + 1 : t + (g === 1 ? Math.max(1, Math.round(SRS_DAYS[box] / 2)) : SRS_DAYS[box]);
    // Przed zaliczeniem z tego przedmiotu każda karta wraca przynajmniej raz.
    const sid = keySubject(key), nx = sid && nextExam(sid);
    if (nx) { const ed = dayN(nx.date); if (ed - 1 > t && due >= ed) due = ed - 1; }
    const patch = { srs: { ...all, [key]: [box, due] } };
    if (!cur || cur[0] === 0) { const sn = S.progress?.srsNew; patch.srsNew = { d: t, n: (sn?.d === t ? sn.n : 0) + 1 }; }
    const st = S.progress?.streak;
    if (st?.d !== t) patch.streak = { d: t, n: st?.d === t - 1 ? (st.n || 0) + 1 : 1 };
    progSoon(patch);
  }
  function srsAdd(keys) {
    const all = srsAll(), t = dayN(), add = {};
    for (const k of keys) if (!all[k]) add[k] = [0, t];

    if (n) progSoon({ srs: { ...all, ...add } });
    return n;
  }

  function srsDue(sid) {
    const all = srsAll(), t = dayN();
    const due = [], fresh = [];
    for (const [k, v] of Object.entries(all)) {
      if (!Array.isArray(v) || (sid && keySubject(k) !== sid)) continue;
      if (v[0] === 0) fresh.push(k); else if (v[1] <= t) due.push(k);

    const left = Math.max(0, NEW_PER_DAY - (sn?.d === t ? sn.n : 0));

    const map = new Map();

      const en = String(x.term || "").trim(); if (!en) continue;

      if (!e.m.includes(m.id)) e.m.push(m.id);

    return h("section", { class: "panel" },
      h("h2", { text: "Zadania krok po kroku i pytania do próbnych testów" }),
      h("p", { class: "muted", style: "font-size:.92rem;max-width:64ch", text: "AI pisze je z naszego opracowania, nie ze slajdów. Wyniki liczbowe są sprawdzane automatycznie wzorem obliczeniowym; zadania ze złym kluczem odpadają. Pytania wyboru do testów biorą się z istniejących quizów." }),
      h("div", { class: "row" },
        h("select", { class: "input", style: "max-width:360px", "aria-label": "Przedmiot", onchange: (e) => { GEN.sid = e.target.value; GEN.log = []; render(); } }, withMats.map((s) => h("option", { value: s.id, selected: s.id === GEN.sid ? true : null }, s.pl + (CALC_SUBJECTS.has(s.id) ? " · z liczeniem" : "")))),
        h("div", { class: "gl-chips" },
          h("button", { type: "button", class: "fchip", "aria-pressed": String(GEN.kind === "worked"), onclick: () => { GEN.kind = "worked"; render(); } }, `Zadania krok po kroku · ${wDone}/${ms.length}`),
          h("button", { type: "button", class: "fchip", "aria-pressed": String(GEN.kind === "bank"), onclick: () => { GEN.kind = "bank"; render(); } }, `Pytania do testów · ${bDone == null ? "…" : bDone}/${ms.length}${bank?.items ? ` (${bank.items.length})` : ""}`))),
      h("div", { class: "row" },
        h("button", { type: "button", class: "btn primary", disabled: GEN.busy || AI.busy ? true : null, onclick: genRun }, GEN.busy ? "Generuję…" : "Uzupełnij przez funkcję AI"),
        GEN.busy ? h("button", { type: "button", class: "btn ghost", onclick: () => { GEN.stop = true; } }, "Zatrzymaj po bieżącym") : null,
        h("button", { type: "button", class: "btn", onclick: genExport }, "Pobierz paczkę (JSON)"),
        h("button", { type: "button", class: "btn", onclick: () => file.click() }, "Wgraj wyniki"), file),
      GEN.log.length ? h("ul", { class: "pipeline" }, GEN.log.map((l) => h("li", {}, h("span", { class: "sdot " + l.state }), h("span", {}, h("span", { text: l.title }), l.detail ? h("span", { class: "muted", style: "font-size:.86rem", text: " · " + l.detail }) : null)))) : null,
      tmplSection(GEN.sid));
  }
  function tmplSection(sid) {
    if (!sid) return null;
    return h("details", { class: "tmpl" }, h("summary", { text: "Szablony próbnych testów dla tego przedmiotu" }),
      h("p", { class: "muted", style: "font-size:.88rem", text: "min = czas w minutach, pass = próg w %, sections = rodzaje pytań (abcd, open, task, case) i ich liczba n. Bez zapisanego szablonu działa domyślny, dobrany do formy zaliczenia z sylabusa." }),
      partsOf(sid).map((part) => {
        const key = exKey(sid, part);
        if (GEN.tmpl[key] === undefined) { GEN.tmpl[key] = null; S.db.doc("exams/" + key).get().then((d) => { GEN.tmpl[key] = d.exists ? d.data() : false; render(); }).catch(() => { GEN.tmpl[key] = false; }); }
        const cur = GEN.tmpl[key] || defaultTemplate(sid, part);
        const ta = h("textarea", { class: "input num", rows: "4", style: "font-family:ui-monospace,monospace;font-size:.84rem" }, JSON.stringify({ min: cur.min, pass: cur.pass, sections: cur.sections }));
        return h("div", { class: "stack", style: "gap:6px" }, h("b", { text: `${ZAL_KIND[part] || part}: ${partLabel(sid, part)}${GEN.tmpl[key] ? "" : " · domyślny"}` }), ta,
          h("div", { class: "row" }, h("button", { type: "button", class: "btn small", onclick: async () => {
            let v; try { v = JSON.parse(ta.value); } catch { toast("To nie jest poprawny JSON."); return; }
            const sections = (Array.isArray(v?.sections) ? v.sections : []).filter((x) => TYPE_LABEL[x?.type] && Number(x?.n) > 0).map((x) => ({ type: x.type, n: Math.min(40, Math.round(Number(x.n))), ...(x.p ? { p: Number(x.p) } : {}) }));
            if (!sections.length) { toast("Szablon musi mieć co najmniej jedną sekcję."); return; }
            const doc = { min: Math.max(5, Math.min(240, Number(v.min) || 45)), pass: Math.max(1, Math.min(100, Number(v.pass) || 50)), sections };
            try { await S.db.doc("exams/" + key).set(doc); GEN.tmpl[key] = doc; toast("Szablon zapisany."); render(); } catch { toast("Nie udało się zapisać (czy uruchomiono skrot-v3.sql?)."); }
          } }, "Zapisz szablon")));
      }));
  }
  function glossarySection() {
    return h("section", { class: "panel" }, h("h2", { text: "Słowniczek EN–PL" }),
      h("p", { class: "muted", style: "font-size:.92rem;max-width:64ch", text: "Zbiera pojęcia ze wszystkich materiałów w jeden słowniczek. Odświeża się sam po wgraniu albo przerobieniu materiału; ręcznie tylko po większych zmianach." }),
      h("div", { class: "row" }, h("button", { type: "button", class: "btn", disabled: GEN.glBusy ? true : null, onclick: async () => {
        GEN.glBusy = true; render();
        try { const n = await glossaryRebuild(); toast(`Słowniczek: ${n} ${plural(n, "pojęcie", "pojęcia", "pojęć")}.`); } catch { toast("Nie udało się zapisać słowniczka (czy uruchomiono skrot-v3.sql?)."); }
        GEN.glBusy = false; render();
      } }, GEN.glBusy ? "Odświeżam…" : "Odśwież słowniczek")));
  }

  // ---------- skróty klawiszowe: „/” słowniczek, w powtórce spacja i 1–4 ----------
  document.addEventListener("keydown", (e) => {
    const t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
    if (typing || e.ctrlKey || e.metaKey || e.altKey || $("layer").childElementCount || $("menu") || document.querySelector(".tour-card")) return;
    if (e.key === "/" && !examRunning()) {
      e.preventDefault();
      if (S.route.view === "glossary") { $("gl-q")?.focus(); return; }
      if (S.route.view !== "materials") go({ view: "materials" });
      requestAnimationFrame(() => $("q")?.focus());
      return;
    }
    if (S.route.view === "review" && S.route.rv?.cards) {
      if ((e.key === " " || e.key === "Enter") && document.activeElement?.tagName !== "BUTTON") { e.preventDefault(); rvFlip(); }
      else if (/^[1-4]$/.test(e.key) && S.route.rv.flipped) { e.preventDefault(); rvGrade(Number(e.key) - 1); }
    }
  });

  // ================= boot =================
  // Najnowszy plan z darmowej strony (plan.skrotbm.pl); jak się nie uda, zostaje kopia wbudowana w stronę.
  fetch("https://plan.skrotbm.pl/plan.json", { cache: "no-cache" }).then((r) => r.ok ? r.json() : null).then((d) => {
    if (d?.groups) { Object.assign(PLAN, d); buildCalendar(); render(); }
  }).catch(() => {});
  if (location.hash.startsWith("#/")) S.route = routeFromHash();
  try { history.replaceState({ view: S.route.view, id: S.route.id, sid: S.route.sid }, "", location.hash || ""); } catch {}
  fetch("sylabus.json").then((r) => r.ok ? r.json() : null).then((d) => { if (d?.courses) { SYL = d; render(); } }).catch(() => {});
  render();
  (async () => {
    const use = window.claude?.use;
    if (!use) { S.noDb = true; S.ready = true; render(); return; }
    const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")].map((p) => p.catch(() => null)));
    S.db = db; S.user = user; S.sample = sample;
    try { const me = await user?.me?.(); S.myName = (me?.name || "").split(" ")[0]; } catch {}
    if (!db) { S.noDb = true; S.ready = true; render(); return; }
    try { S.uid = await user?.id?.(); } catch {}
    try { S.isStarosta = !!(await user?.canEdit?.()); } catch {}
    // Tryb starosty: narzędzia administratora widać tylko po włączeniu przełącznika w „Więcej”.
    S.canEdit = S.isStarosta && ls.get("bm-starosta") === "1";
    // AI: starosta ma pełny panel (S.sample); osoby z pełnym dostępem tylko „Moje materiały” (S.ai, z biletem).
    S.ai = sample; if (!S.isStarosta) S.sample = null;
    render();
    // Gotowe dopiero, gdy obie listy odpowiedziały (danymi albo błędem). Liczymy każdą listę raz,
    // żeby dwa odczyty materiałów albo błąd terminów nie dały „gotowe” przed wczytaniem materiałów.
    const got = new Set();
    const markReady = (k) => { got.add(k); if (got.has("materials") && got.has("deadlines")) S.ready = true; render(); };
    db.collection("materials").orderBy("createdAt", "desc").limit(1000).onSnapshot((snap) => {
      S.materials = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      loadNames(S.materials.map((m) => m.createdBy)); markReady("materials");
      if (S.canEdit && !AI.busy) aiRefresh();
    }, () => markReady("materials"));
    db.collection("deadlines").orderBy("date").limit(1000).onSnapshot((snap) => {
      S.deadlines = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      loadNames(S.deadlines.map((d) => d.createdBy)); markReady("deadlines");
    }, () => markReady("deadlines"));
    db.collection("tasks").orderBy("createdAt", "desc").limit(300).onSnapshot((snap) => { S.tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
    db.doc("meta/sync").onSnapshot((snap) => { S.sync = snap.exists ? snap.data() : null; render(); }, () => {});
    db.collection("announcements").orderBy("createdAt", "desc").limit(5).onSnapshot((snap) => { S.announcements = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
    if (!S.uid) S.progress = progLocal.get()?.data || {};
    if (S.uid) db.collection("data/users/" + S.uid).doc("progress").onSnapshot((snap) => {
      const server = snap.exists ? (snap.data() || {}) : {};
      const local = progLocal.get();
      // Niezapisane zmiany z tej przeglądarki mają pierwszeństwo, dopóki nie trafią do bazy.
      if (local?.dirty && local.data) { S.progress = { ...server, ...local.data }; flushProgress(); }
      else { S.progress = server; progLocal.set({ data: server, dirty: false }); }
      if (S.progress.group && !ls.get("bm-group")) { S.group = S.progress.group; S.sub = S.progress.sub ?? S.sub; }
      render();
    }, () => {});
    if (S.uid) db.collection("myMaterials").orderBy("createdAt", "desc").onSnapshot((snap) => {
      S.mine = snap.docs.map((d) => ({ id: d.id, ...d.data(), mine: true })); S.mineLoaded = true; render();
    }, () => { S.mineLoaded = true; render(); });
    else S.mineLoaded = true;
    if (S.isStarosta) db.collection("reports").orderBy("at", "desc").limit(200).onSnapshot((snap) => { S.reports = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
  })();
})();
</script>

</body></html>
