<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lekcje v3 prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   CZĘŚĆ A — tokeny i podstawowe klasy. W index.html JUŻ ISTNIEJĄ (nie kopiuj).
   ===================================================================== */
:root {
  --green-50: #F5F8F6; --green-100: #EAF5EE; --green-200: #CFE8D8; --green-400: #4CAF72; --green-600: #1A7F45; --green-700: #15703C; --green-900: #0E5A30;
  --lime-100: #F3F9DD; --lime-400: #B7DB4A; --teal-600: #0F6E6E; --mint-100: #E6F7EE;
  --paper: #FAFCFB; --surface: #FFFFFF; --sunk: #EEF3F0; --ink: #050A07; --muted: #1F2D25; --line: #BFCEC5;
  --accent: var(--green-600); --accent-hover: var(--green-700); --accent-ink: #FFFFFF; --accent-soft: var(--green-100); --accent-text: var(--green-900);
  --mark: rgba(76, 175, 114, 0.28);
  --good: var(--green-600); --good-soft: var(--green-100); --warn: #6A3B00; --warn-soft: #FFF4DE; --bad: #8C140C; --bad-soft: #FDECEA;
  --shadow: 0 1px 2px rgba(22, 35, 27, 0.05), 0 6px 18px -10px rgba(22, 35, 27, 0.16);
  --r: 16px;
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--f-display); }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; display: grid; gap: 18px; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
.muted { color: var(--muted); }
.eyebrow { font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent-text); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 700 .95rem var(--f-display); cursor: pointer; text-decoration: none; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 12px; font-size: .86rem; }
.link { background: none; border: 0; padding: 0; color: var(--accent-hover); cursor: pointer; font: 700 .95rem var(--f-display); }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 13px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font: 600 1rem/1.4 var(--f-display); color: var(--ink); cursor: pointer; }
.opt .k { font-weight: 800; color: var(--accent); flex: none; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 200; font-weight: 600; max-width: 90vw; }
.lv-chart svg { width: 100%; height: auto; display: block; }
.lv-chart .cg { stroke: var(--line); stroke-width: 1; opacity: .5; }
.lv-chart .ca { stroke: var(--muted); stroke-width: 1.4; }
.lv-chart .ct { font-size: 11px; fill: var(--muted); }
.lv-chart .cl { font-size: 12px; fill: var(--ink); font-weight: 700; }
.lv-chart .cs { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.lv-chart .s0 { stroke: var(--green-600); } .lv-chart .s1 { stroke: #2E9E8F; } .lv-chart .s2 { stroke: #8AAE3A; } .lv-chart .s3 { stroke: #0E5A30; stroke-dasharray: 6 4; }
.lv-chart .cd { stroke: var(--muted); stroke-dasharray: 3 3; opacity: .6; }
.lv-chart .cm { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.lv-chart .cmb { fill: var(--ink); }
.lv-chart .cmn { fill: #fff; font-size: 11px; font-weight: 800; }
.lv-chart .cv { stroke: var(--warn); stroke-dasharray: 5 4; stroke-width: 1.5; }
.lv-table { overflow-x: auto; }
.lv-table table { border-collapse: collapse; width: 100%; font-size: .93rem; }
.lv-table th, .lv-table td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
.lv-table thead th { background: var(--accent-soft); }
.proto-note { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: .9rem; }

/* =====================================================================
   CZĘŚĆ B — LEKCJE V3. To kopiujesz do index.html (na koniec <style>).
   ===================================================================== */
:root { --lp-fast: 140ms; --lp-base: 240ms; --lp-slow: 420ms; --lp-out: cubic-bezier(.2, .8, .2, 1); --lp-spring: cubic-bezier(.34, 1.56, .64, 1); }

/* --- mapa lekcji (ekran startowy w treści strony) --- */
.lp-map { display: grid; gap: 16px; }
.lp-hero { background: linear-gradient(135deg, var(--mint-100), var(--lime-100)); border: 1px solid var(--green-200); border-radius: 20px; padding: 18px; display: grid; gap: 12px; }
.lp-hero .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lp-hero .big { font-size: 1.15rem; font-weight: 800; }
.lp-goal { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; font-size: .9rem; }
.lp-goal svg { width: 34px; height: 34px; transform: rotate(-90deg); }
.lp-goal .bg { fill: none; stroke: var(--green-200); stroke-width: 5; }
.lp-goal .fg { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .8s var(--lp-out); }
.lp-start { min-height: 54px; font-size: 1.08rem; border-radius: 14px; width: 100%; }
.lp-path { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.lp-node { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; position: relative; padding: 6px 0; }
.lp-node:not(:last-child)::before { content: ""; position: absolute; left: 25px; top: 46px; bottom: -14px; border-left: 3px dashed var(--green-200); }
.lp-node.done:not(:last-child)::before { border-left-style: solid; border-left-color: var(--green-400); }
.lp-dot { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; border: 3px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; position: relative; z-index: 1; padding: 0; font-family: var(--f-display); }
.lp-node.done .lp-dot { background: var(--accent); border-color: var(--accent); color: #fff; }
.lp-node.now .lp-dot { border-color: var(--accent); color: var(--accent-text); box-shadow: 0 0 0 5px var(--accent-soft); animation: lp-ring 1.8s var(--lp-out) 2; }
.lp-node .t { display: grid; gap: 2px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--f-display); color: var(--ink); }
.lp-node .t b { font-size: 1rem; }
.lp-node .t span { font-size: .84rem; color: var(--muted); }
.lp-node.opt .lp-dot { border-style: dashed; }
.lp-stars { display: inline-flex; gap: 2px; font-size: 1.1rem; letter-spacing: 1px; }
.lp-stars .off { filter: grayscale(1); opacity: .3; }
@keyframes lp-ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }

/* --- odtwarzacz: pełny ekran --- */
html.lp-lock, html.lp-lock body { overflow: hidden; }
.lp { position: fixed; inset: 0; z-index: 80; background: var(--paper); display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; }
.lp-top { width: 100%; max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px; }
.lp-x { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.05rem; cursor: pointer; color: var(--ink); }
.lp-bar { flex: 1; display: flex; gap: 4px; height: 10px; align-items: stretch; }
.lp-bar i { flex: 1; border-radius: 99px; background: var(--sunk); position: relative; overflow: hidden; }
.lp-bar i::after { content: ""; position: absolute; inset: 0; border-radius: inherit; transform-origin: left; transform: scaleX(0); background: linear-gradient(90deg, var(--accent), var(--green-400)); transition: transform var(--lp-slow) var(--lp-out); }
.lp-bar i.on::after { transform: scaleX(1); }
.lp-bar i.now { background: var(--green-200); }
.lp-bar.cont i::after { transform: scaleX(var(--p, 0)); background: linear-gradient(90deg, var(--accent), var(--green-400), var(--lime-400)); }
.lp-chip { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-weight: 800; font-size: .88rem; background: var(--accent-soft); color: var(--accent-text); font-variant-numeric: tabular-nums; }
.lp-combo { background: var(--warn-soft); color: var(--warn); }
.lp-combo[hidden] { display: none; }
.lp-stage { overflow-y: auto; overscroll-behavior: contain; padding: 6px 16px 20px; position: relative; -webkit-overflow-scrolling: touch; }
.lp-bottom { width: 100%; max-width: 720px; margin: 0 auto; display: flex; gap: 10px; align-items: center; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.lp-cta { flex: 1; min-height: 54px; font-size: 1.06rem; border-radius: 14px; }
.lp-cta:active:not(:disabled), .lp .opt:active:not(:disabled), .lp-dot:active { transform: scale(.97); }
.lp-help { flex: none; min-height: 54px; border-radius: 14px; }
.lp-help[hidden], .lp-cta[hidden] { display: none; }
.lp-help.lp-hint { border-color: var(--accent); color: var(--accent-text); animation: lp-nudge 1.4s ease-in-out 3; }

/* --- karta --- */
.lp-card { max-width: 640px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 20px 18px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); position: relative; }
.lp-card > * { min-width: 0; }
.lp-kick { display: flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent-text); }
.lp-kick .sec { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--muted); font-size: .8rem; text-align: right; }
.lp-card h2 { font-size: 1.32rem; }
.lp-big { font-size: 1.2rem; line-height: 1.5; font-weight: 600; margin: 0; }
.lp-text { font-size: 1.07rem; line-height: 1.62; display: grid; gap: 10px; }
.lp-text p { margin: 0; overflow-wrap: anywhere; }
.lp-text ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.lp-text li { position: relative; padding: 10px 12px 10px 34px; background: var(--green-50); border-radius: 12px; overflow-wrap: anywhere; }
.lp-text li::before { content: ""; position: absolute; left: 13px; top: 18px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.lp-text li.lp-ghost { background: var(--sunk); color: transparent; user-select: none; min-height: 44px; }
.lp-text li.lp-ghost::before { background: var(--line); }
.lp-text b { background: linear-gradient(transparent 58%, var(--mark) 58%) no-repeat 0 0 / 100% 100%; border-radius: 2px; }
.lp-tapmore { font-size: .88rem; color: var(--muted); font-weight: 600; }
.lp-quote { font-size: 1.15rem; font-weight: 700; line-height: 1.45; padding: 14px 16px; border-radius: 14px; background: var(--sunk); margin: 0; }
.lp-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lp-two .opt { justify-content: center; font-size: 1.05rem; }
.lp-fb { border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.lp-fb.ok { background: var(--good-soft); }
.lp-fb.no { background: var(--warn-soft); }
.lp-fb p { margin: 0; }
.lp-fb .v { font-weight: 800; }
.lp-fb .lbl { font-weight: 700; font-size: .86rem; }
.lp-gap { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--accent); margin: 0 2px; text-align: center; color: transparent; }
.lp-gap.on { color: var(--accent-text); font-weight: 800; border-bottom-color: var(--green-400); background: var(--accent-soft); border-radius: 6px 6px 0 0; padding: 0 6px; }
.lp-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lp-row .btn { flex: 1; min-height: 48px; }
.lp-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; counter-reset: s; }
.lp-steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; background: var(--green-50); border-radius: 12px; padding: 10px 12px; overflow-wrap: anywhere; }
.lp-steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: .85rem; }
.lp-steps li.blank { background: var(--warn-soft); }
.lp-ans { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
.lp-think { display: flex; align-items: center; gap: 10px; font-size: .92rem; color: var(--muted); font-weight: 600; }
.lp-think svg { width: 34px; height: 34px; transform: rotate(-90deg); flex: none; }
.lp-think .bg { fill: none; stroke: var(--sunk); stroke-width: 5; }
.lp-think .fg { fill: none; stroke: var(--lime-400); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 88; stroke-dashoffset: 0; }
.lp-fresh .lp-think .fg { animation: lp-think 7s linear forwards; }
.lp-tip { background: var(--lime-100); border: 1px dashed var(--lime-400); border-radius: 14px; padding: 14px 16px; font-weight: 600; transform: rotate(-.6deg); }
.lp-input { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 1rem/1.5 var(--f-display); resize: vertical; }
.lp-keys { display: grid; gap: 6px; }
.lp-keys label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--green-50); cursor: pointer; }
.lp-formula { padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--green-50); border-radius: 0 10px 10px 0; overflow-x: auto; }
.lp-flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lp-flow li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-weight: 600; position: relative; }
.lp-flow li:not(:last-child)::after { content: "↓"; position: absolute; left: 21px; bottom: -15px; color: var(--accent); font-weight: 800; z-index: 1; }
.lp-flow .n { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
.lp-layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; justify-items: center; }
.lp-layers li { width: var(--w, 100%); background: var(--accent-soft); border: 1.5px solid var(--green-200); border-radius: 12px; padding: 8px 12px; display: grid; gap: 2px; text-align: center; }
.lp-layers li span { font-size: .9rem; color: var(--muted); }
.lp-marks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lp-marks li { display: flex; gap: 10px; align-items: center; background: var(--green-50); border-radius: 10px; padding: 8px 10px; }
.lp-marks .mn { width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .78rem; flex: none; }
.lp-slots { display: grid; gap: 8px; }
.lp-slot { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; min-height: 48px; border: 2px dashed var(--line); border-radius: 12px; padding: 8px 10px; background: var(--surface); text-align: left; font: 600 .98rem var(--f-display); color: var(--ink); cursor: pointer; }
.lp-slot .n { width: 30px; height: 30px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-weight: 800; color: var(--muted); }
.lp-slot.fill { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.lp-slot.ok { border-color: var(--good); background: var(--good-soft); }
.lp-slot.bad { border-color: var(--bad); background: var(--bad-soft); }
.lp-pool { display: flex; flex-wrap: wrap; gap: 8px; }
.lp-pill { border: 1.5px solid var(--green-200); background: var(--surface); border-radius: 12px; padding: 10px 12px; font: 600 .95rem var(--f-display); color: var(--ink); cursor: pointer; text-align: left; box-shadow: var(--shadow); }
.lp-pill.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--green-200); }
.lp-pill.done { opacity: 0; pointer-events: none; transform: scale(.6); transition: opacity var(--lp-base), transform var(--lp-base) var(--lp-out); }
.lp-defs { display: grid; gap: 8px; }
.lp-def { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font: 500 .95rem/1.45 var(--f-display); color: var(--ink); cursor: pointer; display: grid; gap: 4px; }
.lp-def.ok { border-color: var(--good); background: var(--good-soft); cursor: default; }
.lp-def .tag { font-weight: 800; color: var(--accent-text); font-size: .85rem; }
.lp-swipe { position: relative; height: 270px; perspective: 1000px; }
.lp-sw { position: absolute; inset: 0; border-radius: 18px; touch-action: pan-y; cursor: grab; }
.lp-sw.under { transform: translateY(10px) scale(.96); background: var(--surface); border: 1px solid var(--line); opacity: .7; }
.lp-sw.under2 { transform: translateY(20px) scale(.92); background: var(--surface); border: 1px solid var(--line); opacity: .4; }
.lp-sw .in { position: absolute; inset: 0; transition: transform .45s var(--lp-out); transform-style: preserve-3d; }
.lp-sw.flip .in { transform: rotateY(180deg); }
.lp-sw .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; border: 1.5px solid var(--green-200); background: var(--surface) repeating-linear-gradient(0deg, transparent 0 23px, rgba(26,127,69,.07) 23px 24px); display: grid; align-content: center; gap: 8px; padding: 22px; text-align: center; font-weight: 700; font-size: 1.12rem; box-shadow: var(--shadow); }
.lp-sw .face.back { transform: rotateY(180deg); background-color: var(--accent-soft); }
.lp-sw-hint { display: flex; justify-content: space-between; font-size: .85rem; font-weight: 700; color: var(--muted); }
.lp-done-screen { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; justify-items: center; text-align: center; padding-top: 12px; }
.lp-done-screen h2 { font-size: 1.6rem; }
.lp-bigcheck { width: 104px; height: 104px; }
.lp-bigcheck circle { fill: var(--accent); }
.lp-bigcheck path { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
.lp-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.lp-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; display: grid; gap: 2px; }
.lp-stat b { font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.lp-stat span { font-size: .78rem; color: var(--muted); font-weight: 600; }
.lp-bigstars { display: flex; gap: 10px; font-size: 3rem; line-height: 1; }
.lp-bigstars .off { filter: grayscale(1); opacity: .25; }
.lp-actions { display: grid; gap: 10px; width: 100%; }
.lp-actions .btn { min-height: 52px; }
.lp-sheet-scrim { position: absolute; inset: 0; background: rgba(5, 10, 7, .28); opacity: 0; pointer-events: none; transition: opacity var(--lp-base); z-index: 4; }
.lp-sheet-scrim.on { opacity: 1; pointer-events: auto; }
.lp-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; max-width: 720px; margin: 0 auto; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: 0 -12px 30px rgba(5, 10, 7, .14); padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 72dvh; overflow-y: auto; transform: translateY(105%); transition: transform var(--lp-slow) var(--lp-out); display: grid; gap: 10px; }
.lp-sheet.on { transform: none; }
.lp-sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: -6px auto 4px; }
.lp-float { position: fixed; z-index: 90; pointer-events: none; font-weight: 800; font-size: 1.05rem; color: var(--accent); text-shadow: 0 1px 0 #fff; animation: lp-float .95s var(--lp-out) forwards; }
.lp-banner { position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); z-index: 90; transform: translateX(-50%); background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 800; pointer-events: none; animation: lp-banner 1.6s var(--lp-out) forwards; white-space: nowrap; }
.lp-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 95; overflow: hidden; }
.lp-confetti i { position: absolute; top: -14px; width: 8px; height: 13px; border-radius: 2px; animation: lp-fall 2.2s cubic-bezier(.3, .6, .5, 1) forwards; }

/* --- ruch: wejście karty, nowe elementy, informacja zwrotna --- */
.lp-fresh { animation: lp-in var(--lp-slow) var(--lp-out) both; }
.lp-fresh.back { animation-name: lp-in-back; }
.lp-leave { animation: lp-out var(--lp-fast) ease-in both; }
.lp-leave.back { animation-name: lp-out-back; }
.lp-new { animation: lp-in var(--lp-base) var(--lp-out) both; }

function lpChartSvg(v, shown, fresh) {

  const S2 = (v.series || []).filter((s) => (s.points || []).length >= 2);
  const pts = S2.flatMap((s) => s.points).concat((v.marks || []).map((m) => [m.x, m.y ?? 0]));
  if (!pts.length) return "";
  let x0 = Math.min(...pts.map((p) => p[0])), x1 = Math.max(...pts.map((p) => p[0])), y0 = Math.min(0, ...pts.map((p) => p[1])), y1 = Math.max(...pts.map((p) => p[1]));

  const grid = yt.map((t) => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" class="cg"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end" class="ct">${escX(lvNum(t))}</text>`).join("") + xt.map((t) => `<text x="${X(t)}" y="${H - B + 16}" text-anchor="middle" class="ct">${escX(lvNum(t))}</text>`).join("");
  const axes = `<line x1="${L}" x2="${W - R}" y1="${Y(y0)}" y2="${Y(y0)}" class="ca"/><line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" class="ca"/><text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle" class="cl">${escX(v.x || "")}</text><text transform="translate(13 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" class="cl">${escX(v.y || "")}</text>`;
  const lines = S2.map((s, i) => `<path class="cs s${i} lp-draw" d="${s.points.map((p, j) => (j ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ")}"/>`).join("");

    : `<g${cls}><line x1="${X(m.x)}" x2="${X(m.x)}" y1="${Y(m.y)}" y2="${Y(y0)}" class="cd"/><line x1="${L}" x2="${X(m.x)}" y1="${Y(m.y)}" y2="${Y(m.y)}" class="cd"/><circle cx="${X(m.x)}" cy="${Y(m.y)}" r="5" class="cm"/><circle cx="${X(m.x) + 13}" cy="${Y(m.y) - 13}" r="9" class="cmb"/><text x="${X(m.x) + 13}" y="${Y(m.y) - 9}" text-anchor="middle" class="cmn">${i + 1}</text></g>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escX(v.title || "Wykres")}" xmlns="http://www.w3.org/2000/svg">${grid}${axes}${lines}${marks}</svg>`;
}
